[package]
name = "avrcontrol"
version = "1.3.0"
edition = "2024"
description = "Control an Onkyo AV receiver and monitor inputs with global shortcuts"
license = "MIT"
repository = "https://github.com/Virmin8/AVRControl"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10"
toml = "1"
ureq = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
ksni = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
global-hotkey = "0.8"
tray-icon = "0.26"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.31"
